<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto del Amor - Aleiska Gomez</title>
    <style>
        body { background-color: #fdfcf9; font-family: 'Verdana', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .hoja-reto { background: white; width: 100%; max-width: 500px; padding: 40px; border: 1px solid #e0e0e0; box-shadow: 10px 10px 0px #efede7; }
        .btn-volver { text-decoration: none; color: #d4a373; font-size: 12px; font-weight: bold; margin-bottom: 20px; display: block; }
        h1 { color: #d4a373; text-align: center; letter-spacing: 2px; }
        .oracion { font-style: italic; color: #7f8c8d; text-align: center; margin: 20px 0; background: #fffcf0; padding: 15px; border-radius: 10px; }
        .mision-box { border: 2px solid #fefae0; padding: 20px; border-radius: 10px; }
        .check { margin: 15px 0; display: flex; align-items: center; gap: 10px; }
        input[type="checkbox"] { accent-color: #d4a373; transform: scale(1.2); }
    </style>
</head>
<body>
    <div class="hoja-reto">
        <a href="index.html" class="btn-volver">← VOLVER AL MENÚ</a>
        <h1>RETO DEL AMOR</h1>
        <div class="oracion">
            "Padre celestial, que este reto me permita ver con Tus ojos y amar con Tu corazón..."
        </div>
        <div class="mision-box">
            <p><strong>MISIONES DE HOY:</strong></p>
            <div class="check"><input type="checkbox"> <span>Dar una palabra de aliento</span></div>
            <div class="check"><input type="checkbox"> <span>Orar por alguien en necesidad</span></div>
            <div class="check"><input type="checkbox"> <span>Realizar un acto de bondad secreto</span></div>
        </div>
    </div>
</body>
</html>
